name: OmliteRoute CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: Build & Verify OmliteRoute
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Verify Installer Syntax
        run: |
          bash -n install.sh

      - name: Syntax Check Core Executables
        run: |
          node --check bin/omliteroute.mjs
          node --check bin/omniroute-lite.mjs
          node --check bin/cli/commands/top.mjs

      - name: Install Dependencies
        run: |
          npm install --ignore-scripts --prefer-offline

      - name: Verify CLI Version & Commands
        run: |
          node bin/omliteroute.mjs --version
          node bin/omliteroute.mjs top --help
